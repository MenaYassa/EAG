[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eag-engineering-agent"
version = "0.8.0"
description = "An open software engineering operating system for AI engineers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "pydantic-settings>=2.14.2",
    "structlog>=26.1.0",
    "typer>=0.12,<1.0",
    "litellm>=1.0.0",
]

[project.scripts]
eag = "eag.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-click>=7.1.8",
    "pytest-dotenv>=0.5.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
    ignore = ["E501", "F841", "B904", "SIM102"]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]


[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true
disable_error_code = [
    "arg-type",
    "assignment",
    "no-untyped-def",
    "valid-type",
    "var-annotated",
    "no-any-return",
    "attr-defined",
    "type-arg",
    "name-defined",
    "return-value",
    "unused-ignore",
    "syntax"
]

[[tool.mypy.overrides]]
module = "eag.source.python.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "eag.review.*",
    "eag.chief.intelligence.*",
    "eag.benchmark.models",
    "eag.capability.capabilities.*",
    "eag.memory.experience",
    "eag.vcs.runtime",
    "eag.source.runtime",
    "eag.workspace.manager",
    "eag.scheduler.dispatcher",
    "eag.scheduler.runtime",
    "eag.execution_graph.executor",
    "eag.chief.runtime.coordinator",
    "eag.execution.runtime.runtime",
    "eag.execution.executor",
    "eag.benchmark.chief_executor",
    "eag.cli"
]
disable_error_code = [
    "arg-type",
    "assignment",
    "no-untyped-def",
    "valid-type",
    "var-annotated",
    "no-any-return",
    "attr-defined",
    "type-arg",
    "name-defined",
    "return-value",
    "unused-ignore",
    "syntax"
]
